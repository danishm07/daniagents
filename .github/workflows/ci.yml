name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run mypy

  test:
    name: Tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      # Unit tests are fully offline (mocked HTTP, bundled sample data). Live
      # tests (-m live) need EM_API_KEY and are excluded by default addopts.
      - run: uv run pytest -v

  notebooks:
    name: Notebooks (offline / sample mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      # Executed with no EM_API_KEY, so each notebook runs in sample mode
      # against the bundled data — proves they run top-to-bottom.
      - run: uv run pytest --nbmake notebooks/
