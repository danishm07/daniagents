[project]
name = "examples"
version = "0.1.0b1"
description = "Notebook examples for the Explaining Markets competition API and historical archive."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "jupyterlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "nbmake>=1.5",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is importable via the editable install (which points at src/).
addopts = "-m 'not live'"
markers = [
    "live: hits the real Explaining Markets API; needs EM_API_KEY (run with `pytest -m live`)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
# Explicit so import grouping never depends on environment-sensitive
# first-party detection.
known-first-party = ["examples", "tests"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examples"]
